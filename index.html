<script>
  // Local-storage backed replacement for the Claude-artifacts window.storage API,
  // so saved characters/races/classes/theme/sync-config persist in this browser.
  window.storage = {
    async get(key) {
      const v = localStorage.getItem("dndforge::" + key);
      return v === null ? null : { key, value: v, shared: false };
    },
    async set(key, value) {
      localStorage.setItem("dndforge::" + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem("dndforge::" + key);
      return { key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = [];
      const p = "dndforge::" + (prefix || "");
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(p)) keys.push(k.replace("dndforge::", ""));
      }
      return { keys, prefix, shared: false };
    },
  };
</script>

function mod(score) { return Math.floor((score - 10) / 2); }
function fmt(n) { return n >= 0 ? `+${n}` : `${n}`; }
function slugify(s) {
  const base = s.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  return base || `custom-${Date.now()}`;
}
function randomCode() { return Math.random().toString(36).slice(2, 8).toUpperCase(); }
function profBonus(level) { return level < 5 ? 2 : level < 9 ? 3 : level < 13 ? 4 : level < 17 ? 5 : 6; }
function avgHp(hitDie) { return Math.floor(hitDie / 2) + 1; }
function rollHp(hitDie) { return 1 + Math.floor(Math.random() * hitDie); }

/* ---- dice ---- */
const DICE_TYPES = [4, 6, 8, 10, 12, 20, 100];
function rollDie(sides) { return 1 + Math.floor(Math.random() * sides); }
function rollDice(count, sides, modifier = 0) {
  const rolls = Array.from({ length: count }, () => rollDie(sides));
  const total = rolls.reduce((s, n) => s + n, 0) + modifier;
  return { rolls, modifier, total, count, sides };
}
function parseDiceNotation(text) {
  if (!text) return null;
  const m = text.match(/(\d*)\s*d\s*(\d+)\s*(?:([+-])\s*(\d+))?/i);
  if (!m) return null;
  const count = m[1] ? parseInt(m[1], 10) : 1;
  const sides = parseInt(m[2], 10);
  const modifier = m[3] ? (m[3] === "-" ? -1 : 1) * parseInt(m[4], 10) : 0;
  if (!count || !sides) return null;
  return { count, sides, modifier };
}
function rollAbilityScore4d6() {
  const rolls = [1, 2, 3, 4].map(() => rollDie(6));
  rolls.sort((a, b) => a - b);
  rolls.shift(); // drop lowest
  return { total: rolls.reduce((s, n) => s + n, 0), rolls };
}
function generateRolledPool() {
  return Array.from({ length: 6 }, () => rollAbilityScore4d6().total);
}
const STANDARD_ARRAY = [15, 14, 13, 12, 10, 8];

function getBaseScores(char) {
  if (char.abilityMethod === "roll" || char.abilityMethod === "array") {
    const out = {};
    ABILS.forEach((a) => {
      const idx = char.assignments?.[a];
      out[a] = idx !== null && idx !== undefined && char.rolledPool ? char.rolledPool[idx] : 8;
    });
    return out;
  }
  return char.scores;
}

const WEAPON_CATEGORIES = ["Simple Melee", "Simple Ranged", "Martial Melee", "Martial Ranged"];

function parseSimpleDice(str) {
  const m = (str || "").match(/(\d+)\s*d\s*(\d+)/i);
  if (!m) return null;
  return { count: parseInt(m[1], 10), sides: parseInt(m[2], 10) };
}
function weaponAbility(item, finalScores) {
  if (item.abilityOverride) return item.abilityOverride;
  if (item.finesse) return finalScores.dex >= finalScores.str ? "dex" : "str";
  return item.ranged ? "dex" : "str";
}
function computeWeaponAttack(item, finalScores, level) {
  const ability = weaponAbility(item, finalScores);
  const abilityMod = mod(finalScores[ability]);
  const toHit = abilityMod + profBonus(level); // assumes proficiency
  return { ability, abilityMod, toHit, dmgMod: abilityMod };
}

/* ============================================================
   STORAGE HELPERS
   ============================================================ */

async function loadKey(key, fallback) {
  try {
    const res = await window.storage.get(key, false);
    return res ? JSON.parse(res.value) : fallback;
  } catch { return fallback; }
}
async function saveKey(key, value) {
  try { await window.storage.set(key, JSON.stringify(value), false); }
  catch (e) { console.error("save failed", key, e); }
}

/* ============================================================
   CLOUD SYNC HELPERS (Firebase Realtime Database REST API)
   ============================================================ */

function syncPath(code) { return `dndforge/${encodeURIComponent(code)}.json`; }
async function cloudPull(databaseURL, code) {
  const res = await fetch(`${databaseURL.replace(/\/$/, "")}/${syncPath(code)}`);
  if (!res.ok) throw new Error(`Pull failed (${res.status})`);
  return await res.json();
}
async function cloudPush(databaseURL, code, payload) {
  const res = await fetch(`${databaseURL.replace(/\/$/, "")}/${syncPath(code)}`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error(`Push failed (${res.status})`);
  return await res.json();
}

/* ============================================================
   CHARACTER HELPERS
   ============================================================ */

function blankCharacter() {
  return {
    name: "", raceId: null, classId: null, subclassId: null,
    abilityMethod: "pointbuy", // 'pointbuy' | 'roll' | 'array'
    scores: { str: 8, dex: 8, con: 8, int: 8, wis: 8, cha: 8 },
    rolledPool: [], assignments: emptyAssignments(),
    levelHistory: [], // entries for levels 2+
    currentHP: null, tempHP: 0, deathSaves: { success: 0, fail: 0 },
    inventory: [], actions: [],
  };
}

function getAsiBonusTotal(levelHistory) {
  const out = emptyAbilities();
  levelHistory.forEach((l) => {
    if (l.asiChoice && l.asiChoice.type === "asi") {
      ABILS.forEach((a) => { out[a] += l.asiChoice.abilities[a] || 0; });
    }
  });
  return out;
}

/* ============================================================
   MAIN APP
   ============================================================ */

function DndForge() {
  const [tab, setTab] = useState("race");
  const [char, setChar] = useState(blankCharacter());
  const [roster, setRoster] = useState([]);
  const [toast, setToast] = useState("");

  const [races, setRaces] = useState(DEFAULT_RACES);
  const [classes, setClasses] = useState(DEFAULT_CLASSES);
  const [theme, setTheme] = useState(DEFAULT_THEME);
  const [dataLoaded, setDataLoaded] = useState(false);
  const [editMode, setEditMode] = useState(false);
  const [editingRace, setEditingRace] = useState(null);
  const [editingClass, setEditingClass] = useState(null);
  const [levelUpOpen, setLevelUpOpen] = useState(false);

  const [syncConfig, setSyncConfig] = useState(DEFAULT_SYNC);
  const [syncStatus, setSyncStatus] = useState("idle");
  const [syncMessage, setSyncMessage] = useState("");

  const selfTimestampRef = useRef(0);
  const applyingRemoteRef = useRef(false);
  const pushTimerRef = useRef(null);
  const pollTimerRef = useRef(null);

  const [rollHistory, setRollHistory] = useState([]);
  const addRoll = (entry) => setRollHistory((prev) => [{ id: `${Date.now()}-${Math.random()}`, time: Date.now(), ...entry }, ...prev].slice(0, 30));

  const [rollAnim, setRollAnim] = useState(null); // { label, notation, sides, modifier, combine, values, total, phase }
  const tickRef = useRef(null);
  const settleRef = useRef(null);
  const hideRef = useRef(null);

  const triggerRoll = (spec) => {
    clearInterval(tickRef.current);
    clearTimeout(settleRef.current);
    clearTimeout(hideRef.current);

    const count = Math.max(1, spec.count || 1);
    const sides = spec.sides;
    const modifier = spec.modifier || 0;
    const combine = spec.combine || "sum";
    const finalRolls = Array.from({ length: count }, () => rollDie(sides));
    const total = combine === "max" ? Math.max(...finalRolls)
      : combine === "min" ? Math.min(...finalRolls)
      : finalRolls.reduce((s, n) => s + n, 0) + modifier;

    setRollAnim({
      label: spec.label, notation: spec.notation, sides, modifier, combine,
      values: finalRolls.map(() => rollDie(sides)), phase: "rolling",
    });

    tickRef.current = setInterval(() => {
      setRollAnim((prev) => (prev ? { ...prev, values: finalRolls.map(() => rollDie(sides)) } : prev));
    }, 80);

    settleRef.current = setTimeout(() => {
      clearInterval(tickRef.current);
      setRollAnim((prev) => (prev ? { ...prev, values: finalRolls, total, phase: "settled" } : prev));
      addRoll({ label: spec.label, notation: spec.notation, rolls: finalRolls, modifier, total });
    }, 650);

    hideRef.current = setTimeout(() => setRollAnim(null), 650 + 2200);
  };

  useEffect(() => () => {
    clearInterval(tickRef.current);
    clearTimeout(settleRef.current);
    clearTimeout(hideRef.current);
  }, []);

  const race = races.find((r) => r.id === char.raceId) || null;
  const klass = classes.find((c) => c.id === char.classId) || null;
  const subclass = klass?.subclasses?.find((s) => s.id === char.subclassId) || null;
  const level = 1 + char.levelHistory.length;

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2200); };

  /* ---- initial load ---- */
  useEffect(() => {
    (async () => {
      const [r, c, roster0, theme0, sync0] = await Promise.all([
        loadKey("dnd-forge:races", DEFAULT_RACES),
        loadKey("dnd-forge:classes", DEFAULT_CLASSES),
        loadKey("dnd-forge:roster", []),
        loadKey("dnd-forge:theme", DEFAULT_THEME),
        loadKey("dnd-forge:sync-config", DEFAULT_SYNC),
      ]);
      setRaces(r); setClasses(c); setRoster(roster0); setTheme(theme0); setSyncConfig(sync0);
      selfTimestampRef.current = Date.now();
      setDataLoaded(true);
      if (sync0.enabled && sync0.databaseURL && sync0.code) {
        doInitialSync(sync0, { races: r, classes: c, roster: roster0, theme: theme0 });
      }
    })();
    // eslint-disable-next-line
  }, []);

  const doInitialSync = async (cfg, local) => {
    setSyncStatus("syncing");
    try {
      const remote = await cloudPull(cfg.databaseURL, cfg.code);
      if (remote && remote.updatedAt) {
        applyingRemoteRef.current = true;
        setRaces(remote.races || local.races);
        setClasses(remote.classes || local.classes);
        setRoster(remote.roster || local.roster);
        setTheme(remote.theme || local.theme);
        selfTimestampRef.current = remote.updatedAt;
        setSyncStatus("synced"); setSyncMessage("Synced from cloud");
      } else {
        const payload = { ...local, updatedAt: Date.now() };
        await cloudPush(cfg.databaseURL, cfg.code, payload);
        selfTimestampRef.current = payload.updatedAt;
        setSyncStatus("synced"); setSyncMessage("Uploaded local data as the starting point");
      }
    } catch (e) { setSyncStatus("error"); setSyncMessage(e.message || "Sync failed"); }
  };

  /* ---- auto-push on local change (debounced) ---- */
  useEffect(() => {
    if (!dataLoaded) return;
    if (applyingRemoteRef.current) { applyingRemoteRef.current = false; return; }
    saveKey("dnd-forge:races", races);
    saveKey("dnd-forge:classes", classes);
    saveKey("dnd-forge:roster", roster);
    saveKey("dnd-forge:theme", theme);
    if (!syncConfig.enabled || !syncConfig.databaseURL || !syncConfig.code) return;
    clearTimeout(pushTimerRef.current);
    pushTimerRef.current = setTimeout(async () => {
      setSyncStatus("syncing");
      try {
        const payload = { races, classes, roster, theme, updatedAt: Date.now() };
        await cloudPush(syncConfig.databaseURL, syncConfig.code, payload);
        selfTimestampRef.current = payload.updatedAt;
        setSyncStatus("synced"); setSyncMessage(`Pushed at ${new Date(payload.updatedAt).toLocaleTimeString()}`);
      } catch (e) { setSyncStatus("error"); setSyncMessage(e.message || "Sync failed"); }
    }, 700);
    // eslint-disable-next-line
  }, [races, classes, roster, theme, dataLoaded]);

  /* ---- periodic pull ---- */
  useEffect(() => {
    clearInterval(pollTimerRef.current);
    if (!syncConfig.enabled || !syncConfig.databaseURL || !syncConfig.code) return;
    pollTimerRef.current = setInterval(async () => {
      try {
        const remote = await cloudPull(syncConfig.databaseURL, syncConfig.code);
        if (remote && remote.updatedAt && remote.updatedAt > selfTimestampRef.current) {
          applyingRemoteRef.current = true;
          setRaces(remote.races || races);
          setClasses(remote.classes || classes);
          setRoster(remote.roster || roster);
          setTheme(remote.theme || theme);
          selfTimestampRef.current = remote.updatedAt;
          setSyncStatus("synced"); setSyncMessage(`Pulled changes at ${new Date(remote.updatedAt).toLocaleTimeString()}`);
        }
      } catch (e) { /* stay quiet on background errors */ }
    }, 15000);
    return () => clearInterval(pollTimerRef.current);
    // eslint-disable-next-line
  }, [syncConfig]);

  const connectSync = async (cfg) => {
    const next = { ...cfg, enabled: true };
    setSyncConfig(next);
    await saveKey("dnd-forge:sync-config", next);
    await doInitialSync(next, { races, classes, roster, theme });
  };
  const disconnectSync = async () => {
    const next = { ...syncConfig, enabled: false };
    setSyncConfig(next);
    await saveKey("dnd-forge:sync-config", next);
    setSyncStatus("idle"); setSyncMessage("Disconnected — this device is local-only now");
  };
  const manualSync = async () => {
    if (!syncConfig.enabled) return;
    setSyncStatus("syncing");
    try {
      const payload = { races, classes, roster, theme, updatedAt: Date.now() };
      await cloudPush(syncConfig.databaseURL, syncConfig.code, payload);
      selfTimestampRef.current = payload.updatedAt;
      setSyncStatus("synced"); setSyncMessage(`Synced at ${new Date(payload.updatedAt).toLocaleTimeString()}`);
    } catch (e) { setSyncStatus("error"); setSyncMessage(e.message || "Sync failed"); }
  };

  /* ---- ability scores ---- */
  const spent = useMemo(() => ABILS.reduce((sum, a) => sum + (POINT_BUY_COST[char.scores[a]] ?? 0), 0), [char.scores]);
  const remaining = POINT_BUY_BUDGET - spent;
  const asiBonus = useMemo(() => getAsiBonusTotal(char.levelHistory), [char.levelHistory]);
  const baseScores = useMemo(() => getBaseScores(char), [char.abilityMethod, char.scores, char.rolledPool, char.assignments]);
  const finalScores = useMemo(() => {
    const out = {};
    ABILS.forEach((a) => { out[a] = baseScores[a] + (race?.bonuses?.[a] || 0) + asiBonus[a]; });
    return out;
  }, [baseScores, race, asiBonus]);

  const setAbilityMethod = (m) => {
    setChar((c) => {
      if (m === "pointbuy") return { ...c, abilityMethod: m };
      if (m === "roll") return { ...c, abilityMethod: m, rolledPool: generateRolledPool(), assignments: emptyAssignments() };
      return { ...c, abilityMethod: m, rolledPool: [...STANDARD_ARRAY], assignments: emptyAssignments() };
    });
  };
  const rerollPool = () => setChar((c) => ({ ...c, rolledPool: generateRolledPool(), assignments: emptyAssignments() }));
  const assignAbility = (ability, idx) => setChar((c) => ({ ...c, assignments: { ...c.assignments, [ability]: idx === "" ? null : Number(idx) } }));

  const conMod = mod(finalScores.con);
  const maxHP = useMemo(() => {
    if (!klass) return null;
    const base = klass.hitDie + conMod;
    const rest = char.levelHistory.reduce((sum, l) => sum + (l.hpRoll || 0) + conMod, 0);
    return base + rest;
  }, [klass, conMod, char.levelHistory]);
  const currentHP = char.currentHP === null ? maxHP : Math.min(char.currentHP, maxHP ?? char.currentHP);
  const ac = 10 + mod(finalScores.dex);

  const bumpScore = (a, dir) => {
    setChar((c) => {
      const cur = c.scores[a]; const next = cur + dir;
      if (next < 8 || next > 15) return c;
      const nextCost = POINT_BUY_COST[next] ?? 0, curCost = POINT_BUY_COST[cur] ?? 0;
      if (dir > 0 && spent - curCost + nextCost > POINT_BUY_BUDGET) return c;
      return { ...c, scores: { ...c.scores, [a]: next } };
    });
  };

  /* ---- HP controls ---- */
  const applyDamage = (n) => {
    setChar((c) => {
      let temp = c.tempHP, dmg = n;
      if (temp > 0) { const absorbed = Math.min(temp, dmg); temp -= absorbed; dmg -= absorbed; }
      const cur = (c.currentHP === null ? maxHP : c.currentHP);
      return { ...c, tempHP: temp, currentHP: Math.max(0, cur - dmg) };
    });
  };
  const applyHeal = (n) => {
    setChar((c) => {
      const cur = (c.currentHP === null ? maxHP : c.currentHP);
      return { ...c, currentHP: Math.min(maxHP ?? cur + n, cur + n) };
    });
  };
  const setTempHP = (n) => setChar((c) => ({ ...c, tempHP: Math.max(0, n) }));
  const resetHPToMax = () => setChar((c) => ({ ...c, currentHP: maxHP, deathSaves: { success: 0, fail: 0 } }));
  const setDeathSave = (kind, val) => setChar((c) => ({ ...c, deathSaves: { ...c.deathSaves, [kind]: val } }));

  /* ---- inventory / actions ---- */
  const addItem = (item) => setChar((c) => ({ ...c, inventory: [...c.inventory, { id: `${Date.now()}`, qty: 1, equipped: false, ...item }] }));
  const updateItem = (id, patch) => setChar((c) => ({ ...c, inventory: c.inventory.map((i) => (i.id === id ? { ...i, ...patch } : i)) }));
  const deleteItem = (id) => setChar((c) => ({ ...c, inventory: c.inventory.filter((i) => i.id !== id) }));

  const addAction = (action) => setChar((c) => ({ ...c, actions: [...c.actions, { id: `${Date.now()}`, type: "Attack", ...action }] }));
  const updateAction = (id, patch) => setChar((c) => ({ ...c, actions: c.actions.map((a) => (a.id === id ? { ...a, ...patch } : a)) }));
  const deleteAction = (id) => setChar((c) => ({ ...c, actions: c.actions.filter((a) => a.id !== id) }));

  /* ---- roster ---- */
  const saveCharacter = useCallback(async () => {
    if (!char.name.trim()) { showToast("Give your character a name first"); return; }
    const entry = { id: `${Date.now()}`, ...char, name: char.name.trim(), currentHP: currentHP };
    setRoster((prev) => [entry, ...prev]);
    showToast(`${char.name.trim()} saved to your roster`);
  }, [char, currentHP]);

  const loadCharacter = async (entry) => {
    setChar({ ...blankCharacter(), ...entry });
    setTab("sheet");
    showToast(`Loaded ${entry.name}`);
  };
  const deleteCharacterFromRoster = async (id) => setRoster((prev) => prev.filter((r) => r.id !== id));
  const resetBuilder = () => { setChar(blankCharacter()); setTab("race"); };

  /* ---- races / classes editing ---- */
  const upsertRace = async (raceObj) => {
    setRaces((prev) => { const exists = prev.some((r) => r.id === raceObj.id); return exists ? prev.map((r) => (r.id === raceObj.id ? raceObj : r)) : [...prev, raceObj]; });
    setEditingRace(null); showToast(`${raceObj.name} saved`);
  };
  const deleteRace = async (id) => {
    setRaces((prev) => prev.filter((r) => r.id !== id));
    if (char.raceId === id) setChar((c) => ({ ...c, raceId: null }));
    setEditingRace(null);
  };
  const resetRaces = async () => { setRaces(DEFAULT_RACES); showToast("Races reset to defaults"); };

  const upsertClass = async (classObj) => {
    setClasses((prev) => { const exists = prev.some((c) => c.id === classObj.id); return exists ? prev.map((c) => (c.id === classObj.id ? classObj : c)) : [...prev, classObj]; });
    setEditingClass(null); showToast(`${classObj.name} saved`);
  };
  const deleteClass = async (id) => {
    setClasses((prev) => prev.filter((c) => c.id !== id));
    if (char.classId === id) setChar((c) => ({ ...c, classId: null, subclassId: null }));
    setEditingClass(null);
  };
  const resetClasses = async () => { setClasses(DEFAULT_CLASSES); showToast("Classes reset to defaults"); };

  const addCustomSubclass = (classId, sub) => {
    setClasses((prev) => prev.map((c) => (c.id === classId ? { ...c, subclasses: [...(c.subclasses || []), sub] } : c)));
  };

  /* ---- level up ---- */
  const confirmLevelUp = (entry) => {
    setChar((c) => {
      const next = { ...c, levelHistory: [...c.levelHistory, entry] };
      if (entry.subclassId) next.subclassId = entry.subclassId;
      const wasFull = c.currentHP === null || c.currentHP >= (maxHP ?? 0);
      if (wasFull) next.currentHP = null; // stays "at max", recomputed reactively
      else next.currentHP = (c.currentHP ?? 0) + entry.hpRoll + conMod;
      return next;
    });
    setLevelUpOpen(false);
    showToast(`Reached level ${level + 1}!`);
  };
  const undoLevelUp = () => {
    setChar((c) => {
      if (c.levelHistory.length === 0) return c;
      const popped = c.levelHistory[c.levelHistory.length - 1];
      const nextHistory = c.levelHistory.slice(0, -1);
      const next = { ...c, levelHistory: nextHistory };
      if (popped.subclassId && !nextHistory.some((l) => l.subclassId)) next.subclassId = null;
      return next;
    });
  };

  const updateTheme = (patch) => setTheme((t) => ({ ...t, ...patch }));
  const resetTheme = () => { setTheme(DEFAULT_THEME); showToast("Theme reset to defaults"); };

  const fontPreset = FONT_PRESETS.find((f) => f.id === theme.fontPreset) || FONT_PRESETS[0];
  const rootVars = {
    "--bg": theme.bg, "--panel": theme.panel, "--panelAlt": theme.panelAlt, "--border": theme.border,
    "--parchment": theme.parchment, "--parchmentDim": theme.parchmentDim, "--gold": theme.gold, "--burgundy": theme.burgundy,
    "--font-display": `'${fontPreset.display}', serif`, "--font-body": `'${fontPreset.body}', Georgia, serif`,
  };

  return (
    <div className="df-app" style={{ ...styles.app, ...rootVars }}>
      <style>{GLOBAL_CSS}</style>
      <div style={styles.frame}>
        <Header name={char.name} setName={(v) => setChar((c) => ({ ...c, name: v }))} onNew={resetBuilder}
          editMode={editMode} setEditMode={setEditMode} level={level}
          syncStatus={syncConfig.enabled ? syncStatus : null} />
        <TabBar tab={tab} setTab={setTab} rosterCount={roster.length} />

        <div style={styles.body}>
          {editMode && <div style={styles.editBanner}>✎ Edit mode is on — click any card to change it, or add a new one.</div>}

          {tab === "race" && (
            <RacePicker races={races} raceId={char.raceId} setRaceId={(id) => setChar((c) => ({ ...c, raceId: id }))}
              onNext={() => setTab("class")} editMode={editMode} onEdit={setEditingRace} onReset={resetRaces} />
          )}
          {tab === "class" && (
            <ClassPicker classes={classes} classId={char.classId}
              setClassId={(id) => setChar((c) => ({ ...c, classId: id, subclassId: null }))}
              onNext={() => setTab("abilities")} editMode={editMode} onEdit={setEditingClass} onReset={resetClasses} />
          )}
          {tab === "abilities" && (
            <AbilityBuilder char={char} scores={char.scores} bumpScore={bumpScore} remaining={remaining} race={race}
              finalScores={finalScores} onNext={() => setTab("sheet")}
              onSetMethod={setAbilityMethod} onReroll={rerollPool} onAssign={assignAbility} />
          )}
          {tab === "sheet" && (
            <Sheet char={char} race={race} klass={klass} subclass={subclass} level={level}
              finalScores={finalScores} maxHP={maxHP} currentHP={currentHP} ac={ac} conMod={conMod}
              onDamage={applyDamage} onHeal={applyHeal} onSetTemp={setTempHP} onResetHP={resetHPToMax}
              onDeathSave={setDeathSave} onSave={saveCharacter}
              onOpenLevelUp={() => setLevelUpOpen(true)} onUndoLevel={undoLevelUp} />
          )}
          {tab === "inventory" && (
            <InventoryPanel items={char.inventory} onAdd={addItem} onUpdate={updateItem} onDelete={deleteItem} />
          )}
          {tab === "actions" && (
            <ActionsPanel actions={char.actions} inventory={char.inventory} finalScores={finalScores} level={level}
              onAdd={addAction} onUpdate={updateAction} onDelete={deleteAction} onRoll={triggerRoll} />
          )}
          {tab === "dice" && <DicePanel history={rollHistory} onRoll={triggerRoll} onClear={() => setRollHistory([])} />}
          {tab === "roster" && (
            <Roster roster={roster} loaded={dataLoaded} races={races} classes={classes}
              onLoad={loadCharacter} onDelete={deleteCharacterFromRoster} />
          )}
          {tab === "theme" && <ThemePanel theme={theme} updateTheme={updateTheme} resetTheme={resetTheme} />}
          {tab === "sync" && (
            <SyncPanel syncConfig={syncConfig} syncStatus={syncStatus} syncMessage={syncMessage}
              onConnect={connectSync} onDisconnect={disconnectSync} onManualSync={manualSync} />
          )}
        </div>
      </div>
      {toast && <div style={styles.toast}>{toast}</div>}
      {rollAnim && <RollOverlay anim={rollAnim} />}

      {editingRace && (
        <RaceEditor initial={editingRace === "new" ? null : editingRace} onSave={upsertRace}
          onDelete={editingRace !== "new" ? () => deleteRace(editingRace.id) : null} onClose={() => setEditingRace(null)} />
      )}
      {editingClass && (
        <ClassEditor initial={editingClass === "new" ? null : editingClass} onSave={upsertClass}
          onDelete={editingClass !== "new" ? () => deleteClass(editingClass.id) : null} onClose={() => setEditingClass(null)} />
      )}
      {levelUpOpen && klass && (
        <LevelUpModal
          klass={klass} pendingLevel={level + 1} finalScoresBase={{ scores: char.scores, raceBonus: race?.bonuses || {}, asiBonus }}
          hasSubclass={!!char.subclassId}
          onAddCustomSubclass={(sub) => addCustomSubclass(klass.id, sub)}
          onConfirm={confirmLevelUp} onClose={() => setLevelUpOpen(false)}
        />
      )}
    </div>
  );
}

function ClassEditor({ initial, onSave, onDelete, onClose }) {
  const [form, setForm] = useState(initial || {
    id: "", name: "", glyph: "⚔", hitDie: 8, primary: "str", saves: [], armor: "", weapons: "",
    features: [""], blurb: "", asiLevels: [4, 8, 12, 16, 19], subclassLevel: 3, levelFeatures: {}, subclasses: [],
  });
  const set = (patch) => setForm((f) => ({ ...f, ...patch }));
  const setFeaturesText = (text) => setForm((f) => ({ ...f, features: text.split("\n") }));
  const toggleSave = (a) => setForm((f) => ({ ...f, saves: f.saves.includes(a) ? f.saves.filter((s) => s !== a) : [...f.saves, a] }));
  const setAsiText = (text) => setForm((f) => ({ ...f, asiLevels: text.split(",").map((n) => parseInt(n.trim(), 10)).filter((n) => !isNaN(n)) }));
  const setLevelFeaturesText = (text) => {
    const map = {};
    text.split("\n").forEach((line) => {
      const m = line.match(/^\s*(\d+)\s*:\s*(.+)$/);
      if (m) { const lvl = m[1]; map[lvl] = map[lvl] ? [...map[lvl], m[2].trim()] : [m[2].trim()]; }
    });
    set({ levelFeatures: map });
  };
  const levelFeaturesText = Object.entries(form.levelFeatures || {})
    .sort((a, b) => Number(a[0]) - Number(b[0]))
    .flatMap(([lvl, feats]) => feats.map((f) => `${lvl}: ${f}`)).join("\n");

  const handleSave = () => {
    if (!form.name.trim()) return;
    const id = form.id || slugify(form.name);
    onSave({ ...form, id, hitDie: Number(form.hitDie) || 8, features: form.features.map((t) => t.trim()).filter(Boolean), subclassLevel: Number(form.subclassLevel) || 3 });
  };
  return (
    <ModalShell title={initial ? `Edit ${initial.name}` : "New Class"} onClose={onClose} onDelete={onDelete} wide>
      <FormRow label="Name"><input style={styles.input} value={form.name} onChange={(e) => set({ name: e.target.value })} /></FormRow>
      <FormRow label="Glyph (one symbol/emoji)"><input style={styles.input} value={form.glyph} onChange={(e) => set({ glyph: e.target.value })} /></FormRow>
      <FormRow label="Flavor line"><input style={styles.input} value={form.blurb} onChange={(e) => set({ blurb: e.target.value })} /></FormRow>
      <div className="df-form-two-up" style={styles.formTwoUp}>
        <FormRow label="Hit Die">
          <select style={styles.input} value={form.hitDie} onChange={(e) => set({ hitDie: e.target.value })}>
            {[6, 8, 10, 12].map((d) => <option key={d} value={d}>d{d}</option>)}
          </select>
        </FormRow>
        <FormRow label="Primary ability"><input style={styles.input} value={form.primary} onChange={(e) => set({ primary: e.target.value })} /></FormRow>
      </div>
      <FormRow label="Saving throw proficiencies">
        <div style={styles.saveChips}>
          {ABILS.map((a) => (
            <button key={a} type="button" onClick={() => toggleSave(a)} style={{ ...styles.saveChip, ...(form.saves.includes(a) ? styles.saveChipActive : {}) }}>{a.toUpperCase()}</button>
          ))}
        </div>
      </FormRow>
      <FormRow label="Armor proficiencies"><input style={styles.input} value={form.armor} onChange={(e) => set({ armor: e.target.value })} /></FormRow>
      <FormRow label="Weapon proficiencies"><input style={styles.input} value={form.weapons} onChange={(e) => set({ weapons: e.target.value })} /></FormRow>
      <FormRow label="Level 1 features (one per line)">
        <textarea style={styles.textarea} rows={3} value={form.features.join("\n")} onChange={(e) => setFeaturesText(e.target.value)} />
      </FormRow>
      <div className="df-form-two-up" style={styles.formTwoUp}>
        <FormRow label="Ability Score Improvement levels (comma-separated)">
          <input style={styles.input} value={(form.asiLevels || []).join(", ")} onChange={(e) => setAsiText(e.target.value)} />
        </FormRow>
        <FormRow label="Subclass chosen at level">
          <input style={styles.input} type="number" value={form.subclassLevel} onChange={(e) => set({ subclassLevel: e.target.value })} />
        </FormRow>
      </div>
      <FormRow label="Other level features — one per line, format 'level: feature text'">
        <textarea style={styles.textarea} rows={3} placeholder="5: Extra Attack — attack twice on your turn" value={levelFeaturesText} onChange={(e) => setLevelFeaturesText(e.target.value)} />
      </FormRow>
      <div style={{ fontSize: 12, color: "var(--parchmentDim)", marginBottom: 10 }}>
        Subclasses ({(form.subclasses || []).length}) can be added while leveling up this class on the Sheet tab.
      </div>
      <button style={styles.saveBtn} onClick={handleSave}>Save Class</button>
    </ModalShell>
  );
}

/* ============================================================
   LEVEL UP MODAL
   ============================================================ */

function LevelUpModal({ klass, pendingLevel, finalScoresBase, hasSubclass, onAddCustomSubclass, onConfirm, onClose }) {
  const [hpChoice, setHpChoice] = useState(null); // { method, value }
  const [choiceType, setChoiceType] = useState("asi");
  const [asiDraft, setAsiDraft] = useState(emptyAbilities());
  const [featName, setFeatName] = useState("");
  const [featDesc, setFeatDesc] = useState("");
  const [subclassDraft, setSubclassDraft] = useState(null);
  const [addingCustomSub, setAddingCustomSub] = useState(false);
  const [customSubName, setCustomSubName] = useState("");
  const [customSubBlurb, setCustomSubBlurb] = useState("");
  const [customSubFeatures, setCustomSubFeatures] = useState("");

  const isAsiLevel = (klass.asiLevels || []).includes(pendingLevel);
  const needsSubclass = klass.subclassLevel === pendingLevel && !hasSubclass;

  const pointsUsed = ABILS.reduce((s, a) => s + asiDraft[a], 0);
  const remaining = 2 - pointsUsed;

  const currentTotal = (a) => finalScoresBase.scores[a] + (finalScoresBase.raceBonus[a] || 0) + finalScoresBase.asiBonus[a];

  const incAbility = (a) => {
    if (remaining <= 0) return;
    if (currentTotal(a) + asiDraft[a] + 1 > 20) return;
    setAsiDraft((d) => ({ ...d, [a]: d[a] + 1 }));
  };
  const decAbility = (a) => {
    if (asiDraft[a] <= 0) return;
    setAsiDraft((d) => ({ ...d, [a]: d[a] - 1 }));
  };

  const levelFeatures = klass.levelFeatures?.[pendingLevel] || [];
  const activeSubclassId = subclassDraft; // only relevant if choosing this level
  const subclassFeaturesThisLevel = (klass.subclasses || [])
    .flatMap((s) => (s.features || []).filter((f) => f.level === pendingLevel).map((f) => ({ ...f, subclassName: s.name })));

  const asiComplete = !isAsiLevel || (choiceType === "asi" ? pointsUsed === 2 : featName.trim().length > 0);
  const subclassComplete = !needsSubclass || !!subclassDraft;
  const canConfirm = !!hpChoice && asiComplete && subclassComplete;

  const handleAddCustomSub = () => {
    if (!customSubName.trim()) return;
    const sub = {
      id: slugify(customSubName), name: customSubName.trim(), blurb: customSubBlurb.trim(),
      features: customSubFeatures.split("\n").map((t) => t.trim()).filter(Boolean).map((text) => ({ level: klass.subclassLevel, text })),
    };
    onAddCustomSubclass(sub);
    setSubclassDraft(sub.id);
    setAddingCustomSub(false);
    setCustomSubName(""); setCustomSubBlurb(""); setCustomSubFeatures("");
  };

  const handleConfirm = () => {
    const entry = {
      level: pendingLevel, hpRoll: hpChoice.value, hpMethod: hpChoice.method,
      asiChoice: isAsiLevel ? (choiceType === "asi" ? { type: "asi", abilities: asiDraft } : { type: "feat", name: featName.trim(), description: featDesc.trim() }) : null,
      subclassId: needsSubclass ? subclassDraft : null,
    };
    onConfirm(entry);
  };

  return (
    <ModalShell title={`Level Up — reach Level ${pendingLevel}`} onClose={onClose} wide>
      <div style={styles.levelUpSection}>
        <div style={styles.panelTitle}>Hit Points</div>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
          <button style={styles.saveBtn} onClick={() => setHpChoice({ method: "avg", value: avgHp(klass.hitDie) })}>
            Take Average ({avgHp(klass.hitDie)})
          </button>
          <button style={styles.saveBtn} onClick={() => setHpChoice({ method: "roll", value: rollHp(klass.hitDie) })}>
            Roll d{klass.hitDie}
          </button>
          {hpChoice && <span style={{ color: "var(--gold)", fontFamily: "var(--font-display)" }}>+{hpChoice.value} HP {hpChoice.method === "roll" ? "(rolled — click Roll again to reroll)" : ""}</span>}
        </div>
      </div>

      {isAsiLevel && (
        <div style={styles.levelUpSection}>
          <div style={styles.panelTitle}>Ability Score Improvement or Feat</div>
          <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
            <button style={{ ...styles.fontChip, ...(choiceType === "asi" ? styles.fontChipActive : {}) }} onClick={() => setChoiceType("asi")}>Ability Scores</button>
            <button style={{ ...styles.fontChip, ...(choiceType === "feat" ? styles.fontChipActive : {}) }} onClick={() => setChoiceType("feat")}>Feat</button>
          </div>
          {choiceType === "asi" ? (
            <div>
              <div style={{ fontSize: 12.5, color: "var(--parchmentDim)", marginBottom: 8 }}>{remaining} point{remaining === 1 ? "" : "s"} remaining — spread up to +2 across your abilities.</div>
              <div className="df-bonus-grid" style={styles.bonusGrid}>
                {ABILS.map((a) => (
                  <div key={a} style={styles.bonusItem}>
                    <span style={styles.bonusLabel}>{a.toUpperCase()}</span>
                    <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <button className="df-stepbtn" style={styles.stepBtnSmall} onClick={() => decAbility(a)} disabled={asiDraft[a] <= 0}>−</button>
                      <span style={{ minWidth: 14, textAlign: "center" }}>{asiDraft[a]}</span>
                      <button className="df-stepbtn" style={styles.stepBtnSmall} onClick={() => incAbility(a)} disabled={remaining <= 0 || currentTotal(a) + asiDraft[a] >= 20}>+</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div>
              <FormRow label="Feat name"><input style={styles.input} value={featName} onChange={(e) => setFeatName(e.target.value)} placeholder="e.g. Sharpshooter" /></FormRow>
              <FormRow label="What it does (your notes)"><textarea style={styles.textarea} rows={2} value={featDesc} onChange={(e) => setFeatDesc(e.target.value)} /></FormRow>
            </div>
          )}
        </div>
      )}

      {needsSubclass && (
        <div style={styles.levelUpSection}>
          <div style={styles.panelTitle}>Choose a Subclass</div>
          <div className="df-grid" style={{ ...styles.grid, marginBottom: 10 }}>
            {(klass.subclasses || []).map((s) => (
              <div key={s.id} onClick={() => setSubclassDraft(s.id)} style={{ ...styles.card, ...(subclassDraft === s.id ? styles.cardActive : {}) }}>
                <div style={styles.cardName}>{s.name}</div>
                <div style={styles.cardBlurb}>{s.blurb}</div>
                <ul style={styles.traitList}>{(s.features || []).map((f, i) => <li key={i}>Lvl {f.level}: {f.text}</li>)}</ul>
              </div>
            ))}
          </div>
          {!addingCustomSub ? (
            <button style={styles.resetLink} onClick={() => setAddingCustomSub(true)}>+ Add your own subclass (from a book you own)</button>
          ) : (
            <div style={{ border: "1px dashed var(--border)", borderRadius: 8, padding: 12 }}>
              <FormRow label="Subclass name"><input style={styles.input} value={customSubName} onChange={(e) => setCustomSubName(e.target.value)} /></FormRow>
              <FormRow label="Flavor line"><input style={styles.input} value={customSubBlurb} onChange={(e) => setCustomSubBlurb(e.target.value)} /></FormRow>
              <FormRow label="Features gained (one per line)"><textarea style={styles.textarea} rows={3} value={customSubFeatures} onChange={(e) => setCustomSubFeatures(e.target.value)} /></FormRow>
              <button style={styles.saveBtn} onClick={handleAddCustomSub}>Add & Select</button>
            </div>
          )}
        </div>
      )}

      {(levelFeatures.length > 0 || subclassFeaturesThisLevel.length > 0) && (
        <div style={styles.levelUpSection}>
          <div style={styles.panelTitle}>Also unlocked at this level</div>
          <ul style={styles.traitList}>
            {levelFeatures.map((f, i) => <li key={`lf-${i}`}>{f}</li>)}
            {subclassFeaturesThisLevel.map((f, i) => <li key={`sf-${i}`}>{f.subclassName}: {f.text}</li>)}
          </ul>
        </div>
      )}

      <button style={{ ...styles.nextBtn, ...(canConfirm ? {} : styles.nextBtnDisabled) }} disabled={!canConfirm} onClick={handleConfirm}>
        Confirm Level {pendingLevel}
      </button>
    </ModalShell>
  );
}

function SyncPanel({ syncConfig, syncStatus, syncMessage, onConnect, onDisconnect, onManualSync }) {
  const [databaseURL, setDatabaseURL] = useState(syncConfig.databaseURL || "");
  const [code, setCode] = useState(syncConfig.code || randomCode());
  return (
    <div>
      <SectionLabel eyebrow="Ledger" title="Cloud Sync" />
      <div style={styles.panel}>
        {syncConfig.enabled ? (
          <div>
            <div style={styles.syncStatusRow}><StatusDot status={syncStatus} /><span>{syncMessage || "Connected"}</span></div>
            <div style={styles.syncMeta}>
              <div><strong>Database:</strong> {syncConfig.databaseURL}</div>
              <div><strong>Sync code:</strong> {syncConfig.code}</div>
            </div>
            <div style={{ display: "flex", gap: 10, marginTop: 14, flexWrap: "wrap" }}>
              <button style={styles.saveBtn} onClick={onManualSync}>Sync Now</button>
              <button style={styles.rosterBtnDanger} onClick={onDisconnect}>Disconnect</button>
            </div>
          </div>
        ) : (
          <div>
            <p style={styles.syncHint}>Connect to a free cloud database so this roster and customization set stays identical across every device and person using the same sync code.</p>
            <FormRow label="Database URL">
              <input style={styles.input} placeholder="https://your-project-default-rtdb.firebaseio.com" value={databaseURL} onChange={(e) => setDatabaseURL(e.target.value)} />
            </FormRow>
            <FormRow label="Sync code (share this with whoever should see the same data)">
              <div style={{ display: "flex", gap: 8 }}>
                <input style={styles.input} value={code} onChange={(e) => setCode(e.target.value.toUpperCase())} />
                <button style={styles.newBtn} onClick={() => setCode(randomCode())} type="button">New</button>
              </div>
            </FormRow>
            <button style={styles.saveBtn} disabled={!databaseURL.trim() || !code.trim()} onClick={() => onConnect({ databaseURL: databaseURL.trim(), code: code.trim() })}>Connect &amp; Sync</button>
          </div>
        )}
      </div>
    </div>
  );
}
function StatusDot({ status }) {
  const color = status === "synced" ? "#5fae5f" : status === "syncing" ? "#c9a54a" : status === "error" ? "#c05555" : "#7a7264";
  return <span style={{ display: "inline-block", width: 9, height: 9, borderRadius: "50%", background: color }} />;
}

/* ============================================================
   ABILITIES
   ============================================================ */

function AbilityBuilder({ char, scores, bumpScore, remaining, race, finalScores, onNext, onSetMethod, onReroll, onAssign }) {
  const method = char.abilityMethod || "pointbuy";
  const methods = [
    { id: "pointbuy", label: "Point Buy" },
    { id: "roll", label: "Roll (4d6 drop lowest)" },
    { id: "array", label: "Standard Array" },
  ];
  const allAssigned = method !== "pointbuy" && ABILS.every((a) => char.assignments?.[a] !== null && char.assignments?.[a] !== undefined);
  const canProceed = method === "pointbuy" ? remaining === 0 : allAssigned;

  return (
    <div>
      <SectionLabel eyebrow="Chapter III" title="Distribute Your Abilities" />
      <div style={styles.fontRow}>
        {methods.map((m) => (
          <button key={m.id} onClick={() => onSetMethod(m.id)} style={{ ...styles.fontChip, ...(method === m.id ? styles.fontChipActive : {}) }}>{m.label}</button>
        ))}
      </div>

      {method === "pointbuy" && (
        <div style={{ marginTop: 16 }}>
          <div style={styles.budgetRow}>
            <span>Point Buy Budget</span>
            <span style={{ color: remaining === 0 ? "var(--gold)" : "var(--parchment)" }}>{remaining} / {POINT_BUY_BUDGET} remaining</span>
          </div>
          <div className="df-ability-grid" style={styles.abilityGrid}>
            {ABILS.map((a) => {
              const base = scores[a]; const bonus = race?.bonuses?.[a] || 0; const total = finalScores[a];
              return (
                <div key={a} style={styles.abilityCard}>
                  <div style={styles.abilityName}>{ABIL_NAMES[a]}</div>
                  <div style={styles.abilityControls}>
                    <button className="df-stepbtn" style={styles.stepBtn} onClick={() => bumpScore(a, -1)} disabled={base <= 8}>−</button>
                    <div style={styles.abilityScore}>{base}</div>
                    <button className="df-stepbtn" style={styles.stepBtn} onClick={() => bumpScore(a, 1)} disabled={base >= 15 || POINT_BUY_COST[base + 1] - POINT_BUY_COST[base] > remaining}>+</button>
                  </div>
                  <div style={styles.abilityTotal}>{bonus ? `+${bonus} race → ` : ""}<strong>{total}</strong> ({fmt(mod(total))})</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {(method === "roll" || method === "array") && (
        <div style={{ marginTop: 16 }}>
          <div style={styles.budgetRow}>
            <span>{method === "roll" ? "Rolled Pool" : "Standard Array"}</span>
            {method === "roll" && <button style={styles.resetLink} onClick={onReroll}>Reroll all</button>}
          </div>
          <div style={styles.poolRow}>
            {(char.rolledPool || []).map((v, i) => {
              const used = ABILS.some((a) => char.assignments?.[a] === i);
              return <div key={i} style={{ ...styles.poolChip, ...(used ? styles.poolChipUsed : {}) }}>{v}</div>;
            })}
          </div>
          <div className="df-ability-grid" style={styles.abilityGrid}>
            {ABILS.map((a) => {
              const assignedIdx = char.assignments?.[a];
              const bonus = race?.bonuses?.[a] || 0;
              const total = finalScores[a];
              const usedElsewhere = ABILS.filter((x) => x !== a).map((x) => char.assignments?.[x]);
              const options = (char.rolledPool || []).map((v, i) => ({ v, i })).filter(({ i }) => !usedElsewhere.includes(i) || i === assignedIdx);
              return (
                <div key={a} style={styles.abilityCard}>
                  <div style={styles.abilityName}>{ABIL_NAMES[a]}</div>
                  <select style={{ ...styles.input, textAlign: "center", marginBottom: 8 }}
                    value={assignedIdx === null || assignedIdx === undefined ? "" : assignedIdx}
                    onChange={(e) => onAssign(a, e.target.value)}>
                    <option value="">— choose —</option>
                    {options.map(({ v, i }) => <option key={i} value={i}>{v} ({fmt(mod(v))})</option>)}
                  </select>
                  <div style={styles.abilityTotal}>{bonus ? `+${bonus} race → ` : ""}<strong>{total}</strong> ({fmt(mod(total))})</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <NextButton disabled={!canProceed} onClick={onNext} label="View Character Sheet →" />
    </div>
  );
}

/* ============================================================
   SHEET (identity, HP, level-up, feature panels)
   ============================================================ */

function Sheet({ char, race, klass, subclass, level, finalScores, maxHP, currentHP, ac, conMod, onDamage, onHeal, onSetTemp, onResetHP, onDeathSave, onSave, onOpenLevelUp, onUndoLevel }) {
  const [dmgInput, setDmgInput] = useState(5);
  if (!race || !klass) {
    return <div style={styles.emptyState}><div style={styles.emptyGlyph}>✦</div>Choose a race and class first to see your sheet take shape.</div>;
  }
  const hpPct = maxHP ? Math.max(0, Math.min(100, (currentHP / maxHP) * 100)) : 0;
  const hpColor = hpPct > 50 ? "#5fae5f" : hpPct > 20 ? "#c9a54a" : "#c05555";
  const isDown = currentHP <= 0;

  return (
    <div>
      <SectionLabel eyebrow="Chapter IV" title="Character Sheet" />
      <div className="df-sheet-head" style={styles.sheetHead}>
        <div>
          <div style={styles.sheetName}>{char.name || "Unnamed Adventurer"}</div>
          <div style={styles.sheetSub}>
            Level {level} {race.name} {klass.name}{subclass ? ` (${subclass.name})` : ""} · Prof. {fmt(profBonus(level))}
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {level < 20 && <button style={styles.saveBtn} onClick={onOpenLevelUp}>Level Up →</button>}
          {level > 1 && <button style={styles.resetLink} onClick={onUndoLevel}>Undo last level</button>}
        </div>
      </div>

      {/* Health */}
      <div style={styles.panel}>
        <div style={styles.panelTitle}>Health</div>
        <div style={styles.hpBarOuter}><div style={{ ...styles.hpBarInner, width: `${hpPct}%`, background: hpColor }} /></div>
        <div style={styles.hpNumbers}>
          <span><strong style={{ color: "var(--gold)" }}>{currentHP}</strong> / {maxHP} HP</span>
          {char.tempHP > 0 && <span style={{ color: "var(--parchmentDim)" }}>+{char.tempHP} temp</span>}
        </div>
        <div style={styles.hpControls}>
          <input type="number" style={{ ...styles.input, width: 70 }} value={dmgInput} onChange={(e) => setDmgInput(Number(e.target.value) || 0)} />
          <button style={styles.rosterBtnDanger} onClick={() => onDamage(dmgInput)}>Damage</button>
          <button style={styles.rosterBtn} onClick={() => onHeal(dmgInput)}>Heal</button>
          <button style={styles.newBtn} onClick={() => { const n = prompt("Set temporary HP:", char.tempHP); if (n !== null) onSetTemp(Number(n) || 0); }}>Set Temp HP</button>
          <button style={styles.newBtn} onClick={onResetHP}>Full Rest</button>
        </div>
        {isDown && (
          <div style={styles.deathSaves}>
            <div style={styles.panelTitle}>Death Saves</div>
            <div style={{ display: "flex", gap: 20, flexWrap: "wrap" }}>
              <DeathSaveRow label="Successes" value={char.deathSaves.success} onChange={(v) => onDeathSave("success", v)} color="#5fae5f" />
              <DeathSaveRow label="Failures" value={char.deathSaves.fail} onChange={(v) => onDeathSave("fail", v)} color="#c05555" />
            </div>
          </div>
        )}
      </div>

      <div className="df-stat-row" style={{ ...styles.statRow, marginTop: 14 }}>
        <StatBox label="Armor Class" value={ac} />
        <StatBox label="Speed" value={`${race.speed} ft.`} />
        <StatBox label="Hit Die" value={`d${klass.hitDie}`} />
        <StatBox label="Proficiency" value={fmt(profBonus(level))} />
      </div>

      <div className="df-ability-strip" style={styles.abilityStrip}>
        {ABILS.map((a) => (
          <div key={a} style={styles.abilityChip}>
            <div style={styles.abilityChipLabel}>{a.toUpperCase()}</div>
            <div style={styles.abilityChipScore}>{finalScores[a]}</div>
            <div style={styles.abilityChipMod}>{fmt(mod(finalScores[a]))}</div>
          </div>
        ))}
      </div>

      <div className="df-two-col" style={styles.twoCol}>
        <div style={styles.panel}>
          <div style={styles.panelTitle}>Racial Traits — {race.name}</div>
          <ul style={styles.traitList}>{race.traits.map((t, i) => <li key={i}>{t}</li>)}</ul>
        </div>
        <div style={styles.panel}>
          <div style={styles.panelTitle}>Class Features — {klass.name}</div>
          <ul style={styles.traitList}>{klass.features.map((f, i) => <li key={i}>{f}</li>)}</ul>
          <div style={styles.panelMetaRow}><span style={styles.pillDim}>Armor: {klass.armor}</span></div>
          <div style={styles.panelMetaRow}><span style={styles.pillDim}>Weapons: {klass.weapons}</span></div>
        </div>
      </div>

      {subclass && (
        <div style={{ ...styles.panel, marginBottom: 22 }}>
          <div style={styles.panelTitle}>{subclass.name}</div>
          <div style={{ fontSize: 13.5, fontStyle: "italic", color: "var(--parchmentDim)", marginBottom: 8 }}>{subclass.blurb}</div>
          <ul style={styles.traitList}>{(subclass.features || []).map((f, i) => <li key={i}>Lvl {f.level}: {f.text}</li>)}</ul>
        </div>
      )}

      {char.levelHistory.length > 0 && (
        <div style={{ ...styles.panel, marginBottom: 22 }}>
          <div style={styles.panelTitle}>Progression Log</div>
          <ul style={styles.traitList}>
            {char.levelHistory.map((l, i) => (
              <li key={i}>
                Level {l.level}: +{l.hpRoll} HP ({l.hpMethod === "avg" ? "average" : "rolled"})
                {l.asiChoice?.type === "asi" && ` · ASI: ${ABILS.filter((a) => l.asiChoice.abilities[a]).map((a) => `${a.toUpperCase()} +${l.asiChoice.abilities[a]}`).join(", ")}`}
                {l.asiChoice?.type === "feat" && ` · Feat: ${l.asiChoice.name}`}
                {l.subclassId && ` · Subclass chosen`}
              </li>
            ))}
          </ul>
        </div>
      )}

      <button style={styles.saveBtn} onClick={onSave}>Save to Roster</button>
    </div>
  );
}

function DeathSaveRow({ label, value, onChange, color }) {

    <div>
      <div style={{ fontSize: 11.5, color: "var(--parchmentDim)", marginBottom: 4, textTransform: "uppercase", letterSpacing: 1 }}>{label}</div>
      <div style={{ display: "flex", gap: 6 }}>
        {[1, 2, 3].map((n) => (
          <div key={n} onClick={() => onChange(value >= n ? n - 1 : n)}

        ))}

}

function StatBox({ label, value }) {

}

/* ============================================================
   INVENTORY
   ============================================================ */

function InventoryPanel({ items, onAdd, onUpdate, onDelete }) {
  const [name, setName] = useState("");
  const [qty, setQty] = useState(1);
  const [notes, setNotes] = useState("");
  const [isWeapon, setIsWeapon] = useState(false);
  const [weaponMode, setWeaponMode] = useState("preset"); // 'preset' | 'custom'
  const [selectedWeaponId, setSelectedWeaponId] = useState(WEAPONS[0].id);
  const [customDice, setCustomDice] = useState("1d6");
  const [customType, setCustomType] = useState("slashing");
  const [customFinesse, setCustomFinesse] = useState(false);
  const [customRanged, setCustomRanged] = useState(false);
  const [customVersatile, setCustomVersatile] = useState("");
  const [abilityOverride, setAbilityOverride] = useState("");

  const submit = () => {
    if (!name.trim()) return;
    let weaponFields = { weapon: false };
    if (isWeapon) {
      if (weaponMode === "preset") {
        const w = WEAPONS.find((x) => x.id === selectedWeaponId);
        weaponFields = {
          weapon: true, damageDice: w.damageDice, damageType: w.damageType, finesse: w.finesse,
          ranged: w.ranged, versatileDice: w.versatileDice, properties: w.properties,
          abilityOverride: abilityOverride || null,
        };
      } else {
        weaponFields = {
          weapon: true, damageDice: customDice.trim() || "1d4", damageType: customType.trim() || "bludgeoning",
          finesse: customFinesse, ranged: customRanged, versatileDice: customVersatile.trim() || null,
          properties: [], abilityOverride: abilityOverride || null,
        };
      }
    }
    onAdd({ name: name.trim(), qty: qty || 1, notes: notes.trim(), equipped: isWeapon, ...weaponFields });
    setName(""); setQty(1); setNotes(""); setIsWeapon(false); setAbilityOverride("");
  };

  return (
    <div>
      <SectionLabel eyebrow="Pack" title="Items & Equipment" />
      <div style={{ ...styles.panel, marginBottom: 18 }}>
        <div className="df-form-two-up" style={{ ...styles.formTwoUp, gridTemplateColumns: "2fr 1fr" }}>
          <FormRow label="Item name"><input style={styles.input} value={name} onChange={(e) => setName(e.target.value)} placeholder="Longsword, Potion of Healing, Rope (50 ft.)…" /></FormRow>
          <FormRow label="Qty"><input style={styles.input} type="number" value={qty} onChange={(e) => setQty(Number(e.target.value) || 1)} /></FormRow>
        </div>
        <FormRow label="Notes"><input style={styles.input} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="Optional flavor or extra notes…" /></FormRow>

        <label style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12, cursor: "pointer", fontSize: 13.5, color: "var(--parchmentDim)" }}>
          <input type="checkbox" checked={isWeapon} onChange={(e) => setIsWeapon(e.target.checked)} />
          This is a weapon — link it to an attack action
        </label>

        {isWeapon && (
          <div style={{ border: "1px dashed var(--border)", borderRadius: 8, padding: 12, marginBottom: 12 }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <button type="button" style={{ ...styles.fontChip, ...(weaponMode === "preset" ? styles.fontChipActive : {}) }} onClick={() => setWeaponMode("preset")}>From weapon list</button>
              <button type="button" style={{ ...styles.fontChip, ...(weaponMode === "custom" ? styles.fontChipActive : {}) }} onClick={() => setWeaponMode("custom")}>Custom weapon</button>
            </div>

            {weaponMode === "preset" ? (
              <FormRow label="Weapon">
                <select style={styles.input} value={selectedWeaponId} onChange={(e) => setSelectedWeaponId(e.target.value)}>
                  {WEAPON_CATEGORIES.map((cat) => (
                    <optgroup key={cat} label={cat}>
                      {WEAPONS.filter((w) => w.category === cat).map((w) => (
                        <option key={w.id} value={w.id}>{w.name} — {w.damageDice} {w.damageType}</option>
                      ))}
                    </optgroup>
                  ))}
                </select>
              </FormRow>
            ) : (
              <div>
                <div className="df-form-two-up" style={styles.formTwoUp}>
                  <FormRow label="Damage dice"><input style={styles.input} value={customDice} onChange={(e) => setCustomDice(e.target.value)} placeholder="1d8" /></FormRow>
                  <FormRow label="Damage type"><input style={styles.input} value={customType} onChange={(e) => setCustomType(e.target.value)} placeholder="slashing" /></FormRow>
                </div>
                <div className="df-form-two-up" style={styles.formTwoUp}>
                  <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13 }}>
                    <input type="checkbox" checked={customFinesse} onChange={(e) => setCustomFinesse(e.target.checked)} /> Finesse
                  </label>
                  <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13 }}>
                    <input type="checkbox" checked={customRanged} onChange={(e) => setCustomRanged(e.target.checked)} /> Ranged
                  </label>
                </div>
                <FormRow label="Versatile die (optional)"><input style={styles.input} value={customVersatile} onChange={(e) => setCustomVersatile(e.target.value)} placeholder="1d10" /></FormRow>
              </div>
            )}

            <FormRow label="Ability used (leave on Auto unless you want to force it)">
              <select style={styles.input} value={abilityOverride} onChange={(e) => setAbilityOverride(e.target.value)}>
                <option value="">Auto (based on Finesse/Ranged)</option>
                {ABILS.map((a) => <option key={a} value={a}>{ABIL_NAMES[a]}</option>)}
              </select>
            </FormRow>
          </div>
        )}

        <button style={styles.saveBtn} onClick={submit}>Add Item</button>
      </div>

      {items.length === 0 ? (
        <div style={styles.emptyState}><div style={styles.emptyGlyph}>🎒</div>No items yet — add gear, weapons, or potions above.</div>
      ) : (
        <div style={styles.rosterList}>
          {items.map((it) => (
            <div key={it.id} className="df-roster-row" style={styles.rosterRow}>
              <label style={{ display: "flex", alignItems: "center", gap: 6, cursor: "pointer" }} title="Equipped weapons appear as actions">
                <input type="checkbox" checked={it.equipped} onChange={(e) => onUpdate(it.id, { equipped: e.target.checked })} />
              </label>
              <div style={{ flex: 1 }}>
                <div style={styles.rosterName}>
                  {it.name} {it.qty > 1 ? `×${it.qty}` : ""}
                  {it.equipped && <span style={styles.pill}>Equipped</span>}
                  {it.weapon && <span style={styles.pillDim}>⚔ {it.damageDice} {it.damageType}{it.versatileDice ? ` / ${it.versatileDice}` : ""}</span>}
                </div>
                {it.notes && <div style={styles.rosterSub}>{it.notes}</div>}
              </div>
              <div className="df-roster-btnrow" style={styles.rosterBtnRow}>
                <button className="df-stepbtn" style={styles.stepBtnSmall} onClick={() => onUpdate(it.id, { qty: Math.max(1, it.qty - 1) })}>−</button>
                <button className="df-stepbtn" style={styles.stepBtnSmall} onClick={() => onUpdate(it.id, { qty: it.qty + 1 })}>+</button>
                <button style={styles.rosterBtnDanger} onClick={() => onDelete(it.id)}>Delete</button>
              </div>
            </div>
          ))}
        </div>
      )}
      {items.some((it) => it.weapon) && (
        <div style={{ fontSize: 12.5, color: "var(--parchmentDim)", marginTop: 10, fontStyle: "italic" }}>
          Equipped weapons show up automatically on the Actions tab with live to-hit and damage.
        </div>
      )}
    </div>
  );
}

/* ============================================================
   ACTIONS
   ============================================================ */

function ActionsPanel({ actions, inventory, finalScores, level, onAdd, onUpdate, onDelete, onRoll }) {
  const [name, setName] = useState("");
  const [type, setType] = useState("Attack");
  const [details, setDetails] = useState("");

  const submit = () => {
    if (!name.trim()) return;
    onAdd({ name: name.trim(), type, details: details.trim() });
    setName(""); setDetails("");
  };

  const rollForAction = (a) => {
    const parsed = parseDiceNotation(a.details);
    if (!parsed) return;
    onRoll({
      label: a.name, notation: `${parsed.count}d${parsed.sides}${parsed.modifier ? fmt(parsed.modifier) : ""}`,
      count: parsed.count, sides: parsed.sides, modifier: parsed.modifier, combine: "sum",
    });
  };

  const weaponItems = (inventory || []).filter((it) => it.weapon && it.equipped);

  const rollWeaponAttack = (item, attack) => {
    onRoll({ label: `${item.name} — Attack`, notation: `1d20${fmt(attack.toHit)}`, count: 1, sides: 20, modifier: attack.toHit, combine: "sum" });
  };
  const rollWeaponDamage = (item, attack, dice) => {
    const parsed = parseSimpleDice(dice);
    if (!parsed) return;
    onRoll({ label: `${item.name} — Damage`, notation: `${dice}${fmt(attack.dmgMod)} ${item.damageType}`, count: parsed.count, sides: parsed.sides, modifier: attack.dmgMod, combine: "sum" });
  };

  return (
    <div>
      <SectionLabel eyebrow="Combat" title="Actions" />

      {weaponItems.length > 0 && (
        <div style={{ marginBottom: 22 }}>
          <div style={{ fontSize: 11.5, letterSpacing: 1, textTransform: "uppercase", color: "var(--parchmentDim)", marginBottom: 8, fontFamily: "var(--font-display)" }}>
            From Equipped Weapons <span style={{ fontStyle: "italic", textTransform: "none", letterSpacing: 0 }}>(assumes proficiency)</span>
          </div>
          <div style={styles.rosterList}>
            {weaponItems.map((item) => {
              const attack = computeWeaponAttack(item, finalScores, level);
              return (
                <div key={item.id} className="df-roster-row" style={styles.rosterRow}>
                  <div style={{ flex: 1 }}>
                    <div style={styles.rosterName}>{item.name} <span style={styles.pillDim}>Attack</span></div>
                    <div style={styles.rosterSub}>
                      {fmt(attack.toHit)} to hit · {item.damageDice}{fmt(attack.dmgMod)} {item.damageType}
                      {item.versatileDice && ` (two-handed: ${item.versatileDice}${fmt(attack.dmgMod)})`}
                      {" · "}{attack.ability.toUpperCase()}-based
                    </div>
                  </div>
                  <div className="df-roster-btnrow" style={styles.rosterBtnRow}>
                    <button style={styles.rosterBtn} onClick={() => rollWeaponAttack(item, attack)}>🎯 Attack</button>
                    <button style={styles.rosterBtn} onClick={() => rollWeaponDamage(item, attack, item.damageDice)}>🎲 Damage</button>
                    {item.versatileDice && <button style={styles.rosterBtn} onClick={() => rollWeaponDamage(item, attack, item.versatileDice)}>🎲 2H Damage</button>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div style={{ ...styles.panel, marginBottom: 18 }}>
        <div className="df-form-two-up" style={{ ...styles.formTwoUp, gridTemplateColumns: "2fr 1fr" }}>
          <FormRow label="Action name"><input style={styles.input} value={name} onChange={(e) => setName(e.target.value)} placeholder="Fire Bolt, Second Wind, Rage…" /></FormRow>
          <FormRow label="Type">
            <select style={styles.input} value={type} onChange={(e) => setType(e.target.value)}>
              {["Attack", "Spell", "Bonus Action", "Reaction", "Other"].map((t) => <option key={t} value={t}>{t}</option>)}
            </select>
          </FormRow>
        </div>
        <FormRow label="Details"><input style={styles.input} value={details} onChange={(e) => setDetails(e.target.value)} placeholder="+5 to hit, 1d8+3 slashing, range 5 ft." /></FormRow>
        <button style={styles.saveBtn} onClick={submit}>Add Action</button>
      </div>

      {actions.length === 0 && weaponItems.length === 0 ? (
        <div style={styles.emptyState}><div style={styles.emptyGlyph}>⚔</div>No actions yet — equip a weapon in Items, or add a spell or ability above.</div>
      ) : actions.length > 0 ? (
        <div style={styles.rosterList}>
          {actions.map((a) => {
            const rollable = !!parseDiceNotation(a.details);
            return (
              <div key={a.id} className="df-roster-row" style={styles.rosterRow}>
                <div style={{ flex: 1 }}>
                  <div style={styles.rosterName}>{a.name} <span style={styles.pillDim}>{a.type}</span></div>
                  {a.details && <div style={styles.rosterSub}>{a.details}</div>}
                </div>
                <div className="df-roster-btnrow" style={styles.rosterBtnRow}>
                  {rollable && <button style={styles.rosterBtn} onClick={() => rollForAction(a)}>🎲 Roll</button>}
                  <button style={styles.rosterBtnDanger} onClick={() => onDelete(a.id)}>Delete</button>
                </div>
              </div>
            );
          })}
        </div>
      ) : null}
    </div>
  );
}

/* ============================================================
   DICE
   ============================================================ */

function DicePanel({ history, onRoll, onClear }) {
  const [sides, setSides] = useState(20);
  const [count, setCount] = useState(1);
  const [modifier, setModifier] = useState(0);

  const quickRoll = (s) => {
    onRoll({ label: `d${s}`, notation: `1d${s}`, count: 1, sides: s, modifier: 0, combine: "sum" });
  };
  const customRoll = () => {
    onRoll({ label: "Custom Roll", notation: `${count}d${sides}${modifier ? fmt(modifier) : ""}`, count: Math.max(1, count), sides, modifier, combine: "sum" });
  };
  const advantageRoll = (mode) => {
    onRoll({ label: mode === "adv" ? "d20 (Advantage)" : "d20 (Disadvantage)", notation: "2d20", count: 2, sides: 20, modifier: 0, combine: mode === "adv" ? "max" : "min" });
  };

  return (
    <div>
      <SectionLabel eyebrow="Tray" title="Dice Roller" />
      <div style={{ ...styles.panel, marginBottom: 18 }}>
        <div style={styles.panelTitle}>Quick Roll</div>
        <div className="df-dice-grid" style={styles.diceGrid}>
          {DICE_TYPES.map((s) => (
            <button key={s} style={styles.diceBtn} onClick={() => quickRoll(s)}>d{s}</button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
          <button style={styles.newBtn} onClick={() => advantageRoll("adv")}>d20 Advantage</button>
          <button style={styles.newBtn} onClick={() => advantageRoll("dis")}>d20 Disadvantage</button>
        </div>
      </div>

      <div style={{ ...styles.panel, marginBottom: 18 }}>
        <div style={styles.panelTitle}>Custom Roll</div>
        <div className="df-form-two-up" style={styles.customRollRow}>
          <FormRow label="Count">
            <input style={styles.input} type="number" min={1} value={count} onChange={(e) => setCount(Number(e.target.value) || 1)} />
          </FormRow>
          <FormRow label="Die">
            <select style={styles.input} value={sides} onChange={(e) => setSides(Number(e.target.value))}>
              {DICE_TYPES.map((s) => <option key={s} value={s}>d{s}</option>)}
            </select>
          </FormRow>
          <FormRow label="Modifier">
            <input style={styles.input} type="number" value={modifier} onChange={(e) => setModifier(Number(e.target.value) || 0)} />
          </FormRow>
        </div>
        <button style={styles.saveBtn} onClick={customRoll}>Roll {count}d{sides}{modifier ? fmt(modifier) : ""}</button>
      </div>

      <div style={styles.panel}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <div style={styles.panelTitle}>Roll History</div>
          {history.length > 0 && <button style={styles.resetLink} onClick={onClear}>Clear</button>}
        </div>
        {history.length === 0 ? (
          <div style={{ fontSize: 13, color: "var(--parchmentDim)", fontStyle: "italic" }}>No rolls yet — try a die above.</div>
        ) : (
          <div style={styles.rosterList}>
            {history.map((h) => (
              <div key={h.id} style={styles.diceHistoryRow}>
                <div>
                  <div style={styles.rosterName}>{h.label} <span style={styles.pillDim}>{h.notation}</span></div>
                  <div style={styles.rosterSub}>[{h.rolls.join(", ")}]{h.modifier ? ` ${fmt(h.modifier)}` : ""}</div>
                </div>
                <div style={styles.diceTotal}>{h.total}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   ROSTER
   ============================================================ */

function Roster({ roster, loaded, races, classes, onLoad, onDelete }) {
  if (!loaded) return <div style={styles.emptyState}>Opening the roster…</div>;
  if (roster.length === 0) return <div style={styles.emptyState}><div style={styles.emptyGlyph}>⚜</div>No characters saved yet. Build one and hit "Save to Roster" from the Sheet tab.</div>;
  return (
    <div>
      <SectionLabel eyebrow="Archive" title="Your Roster" />
      <div style={styles.rosterList}>
        {roster.map((entry) => {
          const race = races.find((r) => r.id === entry.raceId);
          const klass = classes.find((c) => c.id === entry.classId);
          const lvl = 1 + (entry.levelHistory?.length || 0);
          return (
            <div key={entry.id} className="df-roster-row" style={styles.rosterRow}>
              <div style={styles.rosterGlyph}>{klass?.glyph || "?"}</div>
              <div style={{ flex: 1 }}>
                <div style={styles.rosterName}>{entry.name}</div>
                <div style={styles.rosterSub}>Level {lvl} {race?.name || "?"} {klass?.name || "?"}</div>
              </div>
              <div className="df-roster-btnrow" style={styles.rosterBtnRow}>
                <button style={styles.rosterBtn} onClick={() => onLoad(entry)}>Open</button>
                <button style={styles.rosterBtnDanger} onClick={() => onDelete(entry.id)}>Delete</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ============================================================
   DICE ROLL ANIMATION OVERLAY
   ============================================================ */

function RollOverlay({ anim }) {
  const displayDice = anim.values.slice(0, 8);
  const extra = anim.values.length - displayDice.length;
  const rolling = anim.phase === "rolling";
  const liveTotal = rolling
    ? (anim.combine === "max" ? Math.max(...anim.values)
      : anim.combine === "min" ? Math.min(...anim.values)
      : anim.values.reduce((s, n) => s + n, 0) + anim.modifier)
    : anim.total;

  return (
    <div className="df-roll-overlay" style={styles.rollOverlay}>
      <div style={styles.rollOverlayLabel}>{anim.label} <span style={styles.pillDim}>{anim.notation}</span></div>
      <div style={styles.rollOverlayDice}>
        {displayDice.map((v, i) => (
          <div key={i} className={`df-die ${rolling ? "df-die-rolling" : "df-die-settled"}`} style={styles.rollDie}>{v}</div>
        ))}
        {extra > 0 && <div className="df-die" style={styles.rollDie}>+{extra}</div>}
      </div>
      <div style={{ ...styles.rollOverlayTotal, opacity: rolling ? 0.6 : 1 }}>{liveTotal}</div>
    </div>
  );
}

function SectionLabel({ eyebrow, title }) {
  return <div style={styles.sectionLabel}><div style={styles.eyebrow}>{eyebrow}</div><div style={styles.sectionTitle}>{title}</div></div>;
}
function NextButton({ disabled, onClick, label }) {
  return <button style={{ ...styles.nextBtn, ...(disabled ? styles.nextBtnDisabled : {}) }} disabled={disabled} onClick={onClick}>{label}</button>;
}
